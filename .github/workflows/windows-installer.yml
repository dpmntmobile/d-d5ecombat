name: windows-installer-validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'assets/**'
      - 'characters/**'
      - 'monsters/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Create environment
        run: python -m venv .venv
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Add Inno Setup compiler to PATH
        shell: powershell
        run: |
          $CompilerDirectory = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6"
          if (-not (Test-Path (Join-Path $CompilerDirectory "ISCC.exe"))) { throw "Inno Setup compiler not found" }
          $CompilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build executable and installer
        shell: powershell
        run: .\scripts\build_windows.ps1 -Installer
      - name: Validate clean install, upgrade, and uninstall
        timeout-minutes: 15
        shell: powershell
        run: .\scripts\test_windows_installer.ps1
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-validation-logs
          path: dist/*.log
          if-no-files-found: ignore
