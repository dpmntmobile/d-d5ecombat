name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install development tools and GUI dependencies
        run: python -m pip install -e ".[gui,dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m coverage run -m unittest discover -s tests -q
      - name: Coverage
        run: python -m coverage report
