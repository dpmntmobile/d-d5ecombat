name: windows-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Create environment
        run: python -m venv .venv
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Add Inno Setup compiler to PATH
        shell: powershell
        run: |
          $CompilerDirectory = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6"
          if (-not (Test-Path (Join-Path $CompilerDirectory "ISCC.exe"))) { throw "Inno Setup compiler not found" }
          $CompilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build executable and installer
        shell: powershell
        run: .\scripts\build_windows.ps1 -Installer
      - name: Validate installer lifecycle
        timeout-minutes: 15
        shell: powershell
        run: .\scripts\test_windows_installer.ps1
      - name: Upload installer diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-logs
          path: dist/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Dnd5eCombatSimulator-Windows
          path: |
            dist/Dnd5eCombatSimulator.exe
            dist/installer/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Dnd5eCombatSimulator.exe
            dist/installer/*.exe
